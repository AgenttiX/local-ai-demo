<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 AGENTS · 1 GAME — local AI game studio</title>
<style>
:root{
  --bg:#05070c; --panel:#0b101a; --line:#1b2436; --text:#d7e1f2; --dim:#5b6b85; --faint:#44546e;
  --arch:#38bdf8; --eng:#f472b6; --qa:#34d399; --studio:#f59e0b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:13px/1.5 ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(rgba(56,189,248,.05) 1px,transparent 1px);background-size:22px 22px;
}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
header .logo{font-weight:700;letter-spacing:3px;font-size:14px;color:var(--dim)}
header .logo b{color:var(--arch)}
#live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);letter-spacing:2px}
#live .dot{width:8px;height:8px;border-radius:50%;background:#33415a;transition:background .3s}
#live.on .dot{background:var(--qa);box-shadow:0 0 10px var(--qa);animation:pulse 1.2s infinite}
#live.on{color:var(--qa)}
@keyframes pulse{50%{opacity:.35}}
#prompt{margin-left:auto;color:var(--dim);font-size:12px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 12px;min-height:0}
.row{display:grid;gap:10px;min-height:0;width:100%}
.row.top{grid-template-columns:minmax(220px,350px) minmax(170px,1fr) minmax(150px,300px);flex:1.15}
.row.bot{grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel>h2{margin:0;padding:8px 12px;font-size:10px;letter-spacing:2.5px;color:var(--dim);border-bottom:1px solid var(--line);flex:0 0 auto}
.scroll{overflow-y:auto;flex:1;min-height:0}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:#1c2536;border-radius:4px}
/* agent cards */
#agents{display:flex;flex-direction:column;gap:10px;min-height:0}
.agent{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:10px 12px;flex:1;overflow:hidden}
.agent .top{display:flex;align-items:baseline;gap:8px}
.agent .name{font-weight:700;letter-spacing:2px;color:var(--c)}
.agent .gpu{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:1px 7px;margin-left:auto;white-space:nowrap}
.agent .model{font-size:11px;color:var(--dim);margin-top:2px}
.agent .stat{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px}
.agent .stat .dot{width:7px;height:7px;border-radius:50%;background:#33415a;flex:0 0 auto}
.agent.active .stat .dot{background:var(--c);box-shadow:0 0 8px var(--c);animation:pulse 1.1s infinite}
.agent .last{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* event feed — two-line row: compact time+who meta on top, message below at full width */
.ev{display:flex;flex-direction:column;gap:1px;padding:5px 12px;border-bottom:1px solid #0e1420;border-left:2px solid transparent;font-size:12px;min-width:0}
.ev .meta{display:flex;gap:8px;align-items:baseline;min-width:0}
.ev .t{color:var(--faint);font-size:11px;flex:0 0 auto}
.ev .who{font-weight:700;letter-spacing:1px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev .who .type{color:var(--faint);font-weight:400;font-size:10px}
.ev .what{color:var(--text);overflow-wrap:anywhere}
/* git feed */
.commit{padding:6px 12px;border-bottom:1px solid #0e1420;font-size:12px;display:flex;gap:8px;align-items:baseline}
.commit .h{color:var(--studio);flex:0 0 auto}
.commit .s{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.commit .d{margin-left:auto;color:var(--faint);font-size:11px;flex:0 0 auto}
/* game + shots */
#gamePanel .bar{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim);flex:0 0 auto}
#gamePanel .bar button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:2px 12px;cursor:pointer;font:inherit;font-size:11px}
#gamePanel .bar button:hover{color:var(--text);border-color:#2c3a55}
#game{flex:1;width:100%;border:0;background:#0a0e14;min-height:0}
#shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
#shots .shot{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#0a0e14}
#shots .shot:hover{border-color:#2c3a55}
#shots img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#0a0e14}
#shots .cap{padding:3px 6px;font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shots .empty{color:var(--dim);font-size:12px;padding:20px;grid-column:1/-1}
footer{flex:0 0 auto;padding:7px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);display:flex;gap:10px;align-items:center}
footer .k{color:var(--faint);letter-spacing:2px}
/* narrow pane: stack the rows vertically and scroll; the wide 3-up grid
   only works above ~584px (sum of the minmax mins + gaps + padding) */
@media (max-width:720px){
  #prompt{display:none}
  main{overflow-y:auto}
  .row.top,.row.bot{flex:none;grid-template-columns:1fr}
  #agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .agent{flex:0 0 auto;padding:8px 10px}
  .agent .gpu{white-space:normal;line-height:1.3}
  .agent .model{font-size:10px}
  .row.top .panel{height:340px}
  #gamePanel{height:430px}
  #shots{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
</style>
</head>
<body>
<header>
  <div class="logo"><b>3 AGENTS</b> · 1 GAME · 0 CLOUD CALLS</div>
  <div id="live"><span class="dot"></span><span id="liveTxt">LIVE</span></div>
  <div id="prompt"></div>
</header>
<main>
  <div class="row top">
    <div id="agents"></div>
    <section class="panel"><h2>STUDIO BUS — EVENT STREAM</h2><div class="scroll" id="events"></div></section>
    <section class="panel"><h2>GIT — COMMIT FEED</h2><div class="scroll" id="git"></div></section>
  </div>
  <div class="row bot">
    <section class="panel" id="gamePanel"><h2>THE GAME — PLAYABLE</h2>
      <div class="bar"><span>the product of the three GPUs above — play it</span><button id="reload" style="margin-left:auto">⟳ reload</button><button id="newtab" title="open the game in a new browser tab">↗ new tab</button></div>
      <iframe id="game" src="/game/"></iframe>
    </section>
    <section class="panel"><h2>QA EYES — PLAYTEST SCREENSHOTS</h2><div class="scroll"><div id="shots"></div></div></section>
  </div>
</main>
<footer>
  <span class="k">BRIEF</span><span id="prompt2"></span>
  <span class="k" style="margin-left:auto">3 local GPUs · 0 cloud calls · live via SSE</span>
</footer>
<script>
const $ = (s) => document.querySelector(s);
const C = { architect: "#38bdf8", engineer: "#f472b6", qa: "#34d399", studio: "#f59e0b" };
let agents = [], events = [], git = [], shots = [];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (t) => new Date(t).toTimeString().slice(0, 8);
const ago = (t) => {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  return s < 60 ? s + "s" : s < 3600 ? Math.round(s / 60) + "m" : Math.round(s / 3600) + "h";
};

function renderAgents() {
  $("#agents").innerHTML = agents.map((a) => {
    const mine = events.filter((e) => e.agent === a.id).sort((x, y) => y.t - x.t);
    const last = mine[0];
    const active = last && Date.now() - last.t < 45000;
    return `<div class="agent ${active ? "active" : ""}" style="--c:${C[a.id] || "#888"}">
      <div class="top"><span class="name">${a.name}</span><span class="gpu">${a.gpu} · ${a.host}</span></div>
      <div class="model">${a.model} · ctx ${a.ctx} · ${a.speed}</div>
      <div class="stat"><span class="dot"></span><span class="last">${last ? fmt(last.t) + " — " + esc(last.text) : "waiting for first event"}</span></div>
    </div>`;
  }).join("");
}
function renderEvents() {
  const list = [...events].sort((a, b) => a.t - b.t).slice(-250);
  const el = $("#events");
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  el.innerHTML = list.map((e) =>
    `<div class="ev" style="border-left-color:${C[e.agent] || "#33415a"}">
      <div class="meta"><span class="t">${fmt(e.t)}</span><span class="who" style="color:${C[e.agent] || "#888"}">${e.agent}${e.type ? `<span class="type"> · ${e.type}</span>` : ""}</span></div>
      <div class="what">${esc(e.text)}</div></div>`
  ).join("") || `<div class="ev"><div class="meta"><span class="t">—</span><span class="who" style="color:var(--faint)">bus</span></div><div class="what">no events yet</div></div>`;
  if (nearBottom) el.scrollTop = el.scrollHeight;
}
function renderGit() {
  $("#git").innerHTML = git.map((g) =>
    `<div class="commit"><span class="h">${g.h}</span><span class="s">${esc(g.s)}</span><span class="d">${ago(g.t)}</span></div>`
  ).join("") || `<div class="commit"><span class="s" style="color:var(--dim)">no commits yet</span></div>`;
}
function renderShots() {
  $("#shots").innerHTML = shots.length
    ? shots.map((s) =>
        `<div class="shot" onclick="window.open('${s.path}','_blank')"><img src="${s.path}" loading="lazy"><div class="cap">${s.path.split("/").slice(-2).join("/")}</div></div>`
      ).join("")
    : `<div class="empty">no screenshots yet — QA takes some after each playtest</div>`;
}
function renderAll() { renderAgents(); renderEvents(); renderGit(); renderShots(); }

async function init() {
  const meta = await (await fetch("/api/bus")).json();
  agents = meta.agents;
  events = meta.events;
  $("#prompt").textContent = meta.prompt;
  $("#prompt2").textContent = meta.prompt;
  git = await (await fetch("/api/git")).json();
  shots = await (await fetch("/api/shots")).json();
  renderAll();

  const es = new EventSource("/events");
  const h = (t) => (m) => {
    const d = JSON.parse(m.data);
    if (t === "bus") { events = d; renderEvents(); renderAgents(); }
    if (t === "git") { git = d; renderGit(); }
    if (t === "shots") { shots = d; renderShots(); }
  };
  es.addEventListener("bus", h("bus"));
  es.addEventListener("git", h("git"));
  es.addEventListener("shots", h("shots"));
  es.addEventListener("meta", (m) => {
    const d = JSON.parse(m.data);
    $("#prompt").textContent = d.prompt;
    $("#prompt2").textContent = d.prompt;
  });
  setInterval(() => {
    renderAgents();
    renderGit();
    const hot = events.some((e) => Date.now() - e.t < 30000);
    $("#live").classList.toggle("on", hot);
    $("#liveTxt").textContent = hot ? "LIVE" : "IDLE";
  }, 5000);
}
$("#reload").onclick = () => { $("#game").src = "/game/?t=" + Date.now(); };
$("#newtab").onclick = () => window.open("/game/", "_blank");
init();
</script>
</body>
</html>
